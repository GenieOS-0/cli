name: Release

# Tag-driven publish for @genie-os/cli.
#
#   git tag v0.1.1
#   git push origin v0.1.1
#
# The tag value should match the `version` field in package.json. Provenance
# attestations require this repo to be public.
#
# Note: the CLI bundles @genie-os/sdk via tsup `noExternal`, so it pulls
# the SDK from the npm registry at build time. If you bumped the SDK, make
# sure it's already published before tagging the CLI.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json v$PKG_VERSION"
            exit 1
          fi

      # CLI bundles @genie-os/sdk from the registry, so there's no committed
      # lockfile (it can only be resolved once the SDK is published). Use
      # `npm install`, not `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test --if-present

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
